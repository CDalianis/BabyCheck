name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run build -w @babycheck/shared
      - run: npm run lint -w @babycheck/shared
      - run: npm run lint -w @babycheck/api
      - run: npm run lint -w @babycheck/web
      - run: npm run test -w @babycheck/web
      - run: npm run build -w @babycheck/api
      - run: npm run build -w @babycheck/web
